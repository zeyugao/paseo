name: CLI Tarball Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package (e.g. v0.1.0). Leave empty to update cli-latest from the selected ref."
        required: false
        type: string

concurrency:
  group: cli-tarball-release-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || github.ref) || github.ref }}
  cancel-in-progress: false

env:
  ROLLING_RELEASE_TAG: "cli-latest"

jobs:
  publish-cli-tarballs:
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || github.ref) || github.ref }}

      - name: Resolve release metadata
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG:-}" ]; then
            node scripts/emit-release-env.mjs --source-tag "$INPUT_TAG" >> "$GITHUB_ENV"
            echo "IS_ROLLING_CLI_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/emit-release-env.mjs --source-tag "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "IS_ROLLING_CLI_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          {
            echo "SOURCE_TAG=$ROLLING_RELEASE_TAG"
            echo "RELEASE_TAG=$ROLLING_RELEASE_TAG"
            echo "RELEASE_VERSION=rolling"
            echo "RELEASE_BASE_VERSION=rolling"
            echo "RELEASE_PRERELEASE=rolling"
            echo "IS_PRERELEASE=true"
            echo "IS_BETA=false"
            echo "RELEASE_TYPE=prerelease"
            echo "RELEASE_CHANNEL=rolling"
            echo "DESKTOP_VERSION=rolling"
            echo "IS_SMOKE_TAG=false"
            echo "IS_ROLLING_CLI_RELEASE=true"
          } >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Record build commit
        shell: bash
        run: echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Rewrite internal dependencies to release tarballs
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rewrite-release-tarball-dependencies.mjs

      - name: Pack workspace tarballs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/paseo-tarballs"

          pack_workspace() {
            local workspace="$1"
            local asset_name="$2"
            local pack_output
            local pack_status
            local packed

            set +e
            pack_output="$(npm pack --workspace="$workspace" --pack-destination "$RUNNER_TEMP/paseo-tarballs" 2>&1)"
            pack_status=$?
            set -e
            if (( pack_status != 0 )); then
              printf '%s\n' "$pack_output"
              return "$pack_status"
            fi

            packed="$(printf '%s\n' "$pack_output" | awk '/^[^[:space:]]+\.tgz$/ { name = $0 } END { print name }')"
            if [[ -z "$packed" ]]; then
              printf '%s\n' "$pack_output"
              echo "Unable to determine npm pack tarball name for $workspace" >&2
              return 1
            fi
            mv "$RUNNER_TEMP/paseo-tarballs/$packed" "$RUNNER_TEMP/paseo-tarballs/$asset_name"
          }

          asset_suffix=""
          if [[ "$IS_ROLLING_CLI_RELEASE" == "true" ]]; then
            asset_suffix="-$BUILD_COMMIT"
          fi

          pack_workspace "@getpaseo/highlight" "paseo-highlight${asset_suffix}.tgz"
          pack_workspace "@getpaseo/relay" "paseo-relay${asset_suffix}.tgz"
          pack_workspace "@getpaseo/protocol" "paseo-protocol${asset_suffix}.tgz"
          pack_workspace "@getpaseo/client" "paseo-client${asset_suffix}.tgz"
          pack_workspace "@getpaseo/plugin" "paseo-plugin${asset_suffix}.tgz"
          pack_workspace "@getpaseo/server" "paseo-server${asset_suffix}.tgz"
          pack_workspace "@getpaseo/cli" "paseo-cli${asset_suffix}.tgz"

          if [[ "$IS_ROLLING_CLI_RELEASE" == "true" ]]; then
            cp "$RUNNER_TEMP/paseo-tarballs/paseo-cli${asset_suffix}.tgz" \
              "$RUNNER_TEMP/paseo-tarballs/paseo-cli.tgz"
          fi

      - name: Setup Bun for install smoke test
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Seed Bun install from previous rolling build
        if: env.IS_ROLLING_CLI_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          previous_dir="$RUNNER_TEMP/previous-paseo-cli"
          mkdir -p "$previous_dir"
          if gh release download "$RELEASE_TAG" \
            --pattern "paseo-cli.tgz" \
            --dir "$previous_dir" \
            --clobber \
            --repo "${{ github.repository }}"; then
            BUN_INSTALL="$RUNNER_TEMP/paseo-cli-install" \
              bun install -g --force "$previous_dir/paseo-cli.tgz"
          else
            echo "No previous rolling CLI asset; testing a fresh install."
          fi

      - name: Update rolling CLI tag
        if: env.IS_ROLLING_CLI_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$RELEASE_TAG" "$BUILD_COMMIT"
          git push origin "refs/tags/$RELEASE_TAG" --force

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [[ "$IS_ROLLING_CLI_RELEASE" == "true" ]]; then
              gh release edit "$RELEASE_TAG" \
                --repo "${{ github.repository }}" \
                --title "Paseo CLI latest" \
                --notes "Rolling CLI tarball build from ${BUILD_COMMIT}." \
                --prerelease
            fi
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
          )

          if [[ "$IS_ROLLING_CLI_RELEASE" == "true" ]]; then
            release_args+=(
              --target "$BUILD_COMMIT"
              --title "Paseo CLI latest"
              --notes "Rolling CLI tarball build from ${BUILD_COMMIT}."
              --prerelease
            )
          else
            release_args+=(
              --title "Paseo $RELEASE_TAG"
              --notes ""
            )
          fi

          if [[ "$IS_PRERELEASE" == "true" && "$IS_ROLLING_CLI_RELEASE" != "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
          fi

      - name: Upload tarballs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/paseo-tarballs/*.tgz --clobber --repo "${{ github.repository }}"

      - name: Verify published CLI installation
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          install_root="$RUNNER_TEMP/paseo-cli-install"
          cli_url="https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/paseo-cli.tgz?build=$BUILD_COMMIT"
          BUN_INSTALL="$install_root" bun install -g --force "$cli_url"
          "$install_root/bin/paseo" --version

          node - "$install_root" "$BUILD_COMMIT" <<'NODE'
          const [root, expectedCommit] = process.argv.slice(2);
          for (const name of ["cli", "server", "protocol"]) {
            const packageJson = require(`${root}/install/global/node_modules/@getpaseo/${name}/package.json`);
            if (packageJson.paseoBuildCommit !== expectedCommit) {
              throw new Error(`${packageJson.name} came from ${packageJson.paseoBuildCommit ?? "an unstamped build"}`);
            }
          }
          require.resolve("semver", {
            paths: [`${root}/install/global/node_modules/@getpaseo/protocol`],
          });
          NODE

      - name: Remove superseded rolling assets
        if: env.IS_ROLLING_CLI_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          current_suffix="-$BUILD_COMMIT.tgz"
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [[ "$asset" =~ ^paseo-(cli|client|highlight|protocol|relay|plugin|server)-[0-9a-f]{40}\.tgz$ && "$asset" != *"$current_suffix" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "${{ github.repository }}"
              fi
            done
