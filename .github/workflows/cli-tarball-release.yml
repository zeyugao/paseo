name: Server Tarball Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package (e.g. v0.1.0). Leave empty to update server-latest from the selected ref."
        required: false
        type: string

concurrency:
  group: server-tarball-release-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || github.ref) || github.ref }}
  cancel-in-progress: false

env:
  ROLLING_RELEASE_TAG: "server-latest"

jobs:
  publish-server-tarball:
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || github.ref) || github.ref }}

      - name: Resolve release metadata
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG:-}" ]; then
            node scripts/emit-release-env.mjs --source-tag "$INPUT_TAG" >> "$GITHUB_ENV"
            echo "IS_ROLLING_SERVER_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/emit-release-env.mjs --source-tag "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "IS_ROLLING_SERVER_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          {
            echo "SOURCE_TAG=$ROLLING_RELEASE_TAG"
            echo "RELEASE_TAG=$ROLLING_RELEASE_TAG"
            echo "IS_PRERELEASE=true"
            echo "IS_ROLLING_SERVER_RELEASE=true"
          } >> "$GITHUB_ENV"

      - name: Update rolling server tag
        if: env.IS_ROLLING_SERVER_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [[ "$IS_ROLLING_SERVER_RELEASE" == "true" ]]; then
              gh release edit "$RELEASE_TAG" \
                --repo "${{ github.repository }}" \
                --title "Paseo Server latest" \
                --notes "Rolling server tarball build from ${GITHUB_SHA}." \
                --prerelease
            fi
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
          )

          if [[ "$IS_ROLLING_SERVER_RELEASE" == "true" ]]; then
            release_args+=(
              --target "$GITHUB_SHA"
              --title "Paseo Server latest"
              --notes "Rolling server tarball build from ${GITHUB_SHA}."
              --prerelease
            )
          else
            release_args+=(
              --title "Paseo $RELEASE_TAG"
              --notes ""
            )
          fi

          if [[ "$IS_PRERELEASE" == "true" && "$IS_ROLLING_SERVER_RELEASE" != "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack server tarball
        shell: bash
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/paseo-server-tarball"
          mkdir -p "$output_dir"

          set +e
          pack_output="$(npm pack --workspace=@getpaseo/server --pack-destination "$output_dir" 2>&1)"
          pack_status=$?
          set -e
          if (( pack_status != 0 )); then
            printf '%s\n' "$pack_output"
            exit "$pack_status"
          fi

          packed="$(printf '%s\n' "$pack_output" | awk '/^[^[:space:]]+\.tgz$/ { name = $0 } END { print name }')"
          if [[ -z "$packed" ]]; then
            printf '%s\n' "$pack_output"
            echo "Unable to determine the server tarball name" >&2
            exit 1
          fi

          mv "$output_dir/$packed" "$output_dir/paseo-server.tgz"

      - name: Upload server tarball to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/paseo-server-tarball/paseo-server.tgz" \
            --clobber \
            --repo "${{ github.repository }}"
